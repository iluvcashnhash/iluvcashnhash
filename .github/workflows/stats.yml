name: activity stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Render stats
        env:
          # optional secret STATS_TOKEN (classic PAT, read:user) adds private contributions
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/stats.py
      - name: Publish as a single commit
        # the repo is kept history-free: every update replaces the only commit
        run: |
          git diff --quiet -- assets && exit 0
          git config user.name "iluvcashnhash"
          git config user.email "214665437+iluvcashnhash@users.noreply.github.com"
          git checkout --orphan fresh
          git add -A
          git commit -q -m "profile"
          git push --force origin fresh:main
